[connectivity]
# Three shared adapters keep the host ABI pointers independent while avoiding
# one m_axi adapter per argument.  g2 carries the packed input and output BOs
# plus both mailboxes, and is deliberately attached to HPC0.
sp=snn_qp_v06_1.A_cfg:HP0
sp=snn_qp_v06_1.C_cfg:HP0
sp=snn_qp_v06_1.G_cfg:HP0
sp=snn_qp_v06_1.cns_cfg:HP0
sp=snn_qp_v06_1.row_scale_cfg:HP0
sp=snn_qp_v06_1.A_ddr:HP1
sp=snn_qp_v06_1.C_ddr:HP1
sp=snn_qp_v06_1.Ct_ddr:HP1
sp=snn_qp_v06_1.G_ddr:HP1
sp=snn_qp_v06_1.b_in:HPC0
sp=snn_qp_v06_1.d_in:HPC0
sp=snn_qp_v06_1.x0_in:HPC0
sp=snn_qp_v06_1.mb_in:HPC0
sp=snn_qp_v06_1.mb_out:HPC0
# The dynamic output BO is in the same g2/HPC0 address space as mailbox-in
# and the per-solve vectors, so one packed BO never crosses memory groups.
sp=snn_qp_v06_1.x_raw_out:HPC0
sp=snn_qp_v06_1.telemetry_out:HPC0
